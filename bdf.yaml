    dataStandard:
      - dicom
    proprietary: false
    source: https://data.midrc.org/

output:
  - name: Imaging image 1
    dataCategory: imaging
    dataClass: image
    dataType: radiology
    format:
      - dicom
    dataStandard:
      - dicom
    proprietary: false
    source: https://data.midrc.org/

license:
  license_type: Apache-2.0
  link: https://github.com/MIDRC/Stanford_Penn_MIDRC_Deidentifier/blob/master/LICENSE

funding:
