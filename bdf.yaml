version: 0.0.1

tool:
  name: Rad-De-ID
  repo_url: https://github.com/MIDRC/Stanford_Penn_MIDRC_Deidentifier
  tool_homepage: https://github.com/MIDRC/Stanford_Penn_MIDRC_Deidentifier
  documentation_url: https://github.com/MIDRC/Stanford_Penn_MIDRC_Deidentifier/blob/master/README.md
  tool_type: Script
  tool_notes: De-identifier model - https://huggingface.co/StanfordAIMI/stanford-deidentifier-base

llm:
  usesLlm: false
  bringOwnKey: false

